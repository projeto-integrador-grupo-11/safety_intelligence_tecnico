<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="public/img/favicon.png">
    <link rel="stylesheet" href="public/css/cadastro.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Montserrat+Alternates:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>Safety Intelligence - Alterar senha</title>
</head>

<body>

        <div class="container-alterar">
            <h1 class="titulo-pagina">Alterar senha</h1>

            <div id="cardErro" style="display:none; color:#dc2626; text-align:center; margin:8px 0;">
                <span id="mensagem_erro"></span>
            </div>
              <div class="field">
                <label for="nova_senha">Senha</label>
                <div class="input-wrap">
                    <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="4" y="11" width="16" height="10" rx="2" />
                        <path d="M8 11V7a4 4 0 0 1 8 0v4" />
                    </svg>
                    <input oninput="validarSenha()" id="nova_senha" type="password" placeholder="Crie uma senha forte">
                    <button type="button" class="toggle-pw" aria-label="Mostrar senha" onclick="togglePw(this)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                    </button>
                </div>
                <div class="pw-strength">
                    <div class="pw-bars" id="pw_bars" data-strength="0">
                        <span class="pw-bar"></span>
                        <span class="pw-bar"></span>
                        <span class="pw-bar"></span>
                        <span class="pw-bar"></span>
                    </div>
                    <div class="field-feedback" id="div_nome"></div>
                </div>
            </div>
            
            <div class="field">
                <label for="confirmar_senha">Confirmar senha</label>
                <div class="input-wrap">
                    <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 12 11 14 15 10" />
                        <rect x="4" y="4" width="16" height="16" rx="3" />
                    </svg>
                    <input oninput="confirmarSenha()" id="confirmar_senha" type="password" placeholder="Repita a senha">
                </div>
                <div class="field-feedback" id="div_confirmSenha"></div>
            </div>



            <button type="button" class="cadastrar" id="btn-alterar-senha">Confirmar</button>

            <p class="login"><a href="/login.html">Voltar ao login</a></p>

        </div>

    <script>
         function validarSenha() {
            var senha = nova_senha.value;
            var regras = {
                len: senha.length >= 8,
                upp: /[A-Z]/.test(senha),
                low: /[a-z]/.test(senha),
                num: /[0-9]/.test(senha),
                spc: /[!@#$%&*]/.test(senha)
            };

            var pass = 0;
            Object.keys(regras).forEach(function (k) {
                if (regras[k]) {
                    pass++;
                }
            });

            var strength = 0;
            if (senha.length === 0) strength = 0;
            else if (pass <= 2) strength = 1;
            else if (pass === 3) strength = 2;
            else if (pass === 4) strength = 3;
            else if (pass === 5) strength = 4;

            document.getElementById('pw_bars').dataset.strength = strength;

            senhaValida = pass === 5;
            setClass(ipt_senha, 'is-valid', senhaValida);
            setClass(ipt_senha, 'is-invalid', senha.length > 0 && !senhaValida);

            if (ipt_confSenha.value) confirmarSenha();
            
        }

        function confirmarSenha() {
            var senha = confirmar_senha.value;
            var confirmSenha = ipt_confSenha.value;
            var fb = div_confirmSenha;
            if (!confirmSenha) {
                fb.innerHTML = "";
                setClass(ipt_confSenha, 'is-valid', false);
                setClass(ipt_confSenha, 'is-invalid', false);
                confirmValido = false;
                return;
            }
            if (senha !== confirmSenha) {
                fb.innerHTML = '<span class="err">As senhas não coincidem</span>';
                setClass(ipt_confSenha, 'is-invalid', true);
                setClass(ipt_confSenha, 'is-valid', false);
                confirmValido = false;
            } else {
                fb.innerHTML = '<span class="ok">Senhas iguais</span>';
                setClass(ipt_confSenha, 'is-valid', true);
                setClass(ipt_confSenha, 'is-invalid', false);
                confirmValido = true;
                atualizarBotao();
            }
        }
        (function () {
            var email = sessionStorage.getItem('EMAIL_RECUPERACAO');
            var codigo = sessionStorage.getItem('CODIGO_RECUPERACAO');
            if (!email || !codigo) {
                // Sem contexto válido: recomeça o fluxo.
                window.location.href = '/confirmar-email.html';
                return;
            }

            var btn = document.getElementById('btn-alterar-senha');
            var cardErro = document.getElementById('cardErro');
            var mensagemErro = document.getElementById('mensagem_erro');

            function mostrarErro(msg) {
                cardErro.style.display = 'block';
                mensagemErro.textContent = msg;
            }

            btn.addEventListener('click', function () {
                cardErro.style.display = 'none';
                var nova = document.getElementById('nova_senha').value;
                var confirmar = document.getElementById('confirmar_senha').value;

                if (!nova || nova.length < 8) {
                    mostrarErro('A nova senha precisa ter ao menos 8 caracteres.');
                    return;
                }
                if (nova !== confirmar) {
                    mostrarErro('As senhas não coincidem.');
                    return;
                }

                btn.disabled = true;
                fetch('/usuarios/redefinirSenha', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        emailServer: email,
                        codigoServer: codigo,
                        novaSenhaServer: nova
                    })
                }).then(function (resposta) {
                    if (resposta.ok) {
                        sessionStorage.removeItem('EMAIL_RECUPERACAO');
                        sessionStorage.removeItem('CODIGO_RECUPERACAO');
                        alert('Senha alterada com sucesso! Faça login com a nova senha.');
                        window.location.href = '/login.html';
                    } else {
                        btn.disabled = false;
                        resposta.text().then(function (texto) {
                            mostrarErro(texto || 'Não foi possível alterar a senha.');
                        });
                    }
                }).catch(function () {
                    btn.disabled = false;
                    mostrarErro('Não foi possível conectar ao servidor.');
                });
            });
        })();
    </script>

</body>

</html>
