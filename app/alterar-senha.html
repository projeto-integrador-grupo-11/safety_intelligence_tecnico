<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="public/img/favicon.png">
    <link rel="stylesheet" href="public/css/cadastro.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Montserrat+Alternates:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>Safety Intelligence - Alterar senha</title>
</head>

<body>

    <header class="navbar">
        <div class="logoNav">
            <a href="/index.html" class="logo-link" aria-label="Ir para o início">
                <img src="public/img/marca.png" class="logo" alt="Safety Intelligence">
            </a>
        </div>
    </header>

    <div class="posicao">
        <div class="container">

            <div class="logoCadastro">
                <img src="public/img/logo.png" alt="">
            </div>

            <h1 class="titulo-pagina">Alterar senha</h1>

            <div id="cardErro" style="display:none; color:#dc2626; text-align:center; margin:8px 0;">
                <span id="mensagem_erro"></span>
            </div>

            <label for="nova-senha">Nova senha</label>
            <input id="nova-senha" type="password" placeholder="Digite a nova senha" autocomplete="new-password">

            <label for="confirmar-senha">Confirmar senha</label>
            <input id="confirmar-senha" type="password" placeholder="Confirme a nova senha" autocomplete="new-password">

            <button type="button" class="cadastrar" id="btn-alterar-senha">Confirmar</button>

            <p class="login"><a href="/login.html">Voltar ao login</a></p>

        </div>
    </div>

    <script>
        (function () {
            var email = sessionStorage.getItem('EMAIL_RECUPERACAO');
            var codigo = sessionStorage.getItem('CODIGO_RECUPERACAO');
            if (!email || !codigo) {
                // Sem contexto válido: recomeça o fluxo.
                window.location.href = '/confirmar-email.html';
                return;
            }

            var btn = document.getElementById('btn-alterar-senha');
            var cardErro = document.getElementById('cardErro');
            var mensagemErro = document.getElementById('mensagem_erro');

            function mostrarErro(msg) {
                cardErro.style.display = 'block';
                mensagemErro.textContent = msg;
            }

            btn.addEventListener('click', function () {
                cardErro.style.display = 'none';
                var nova = document.getElementById('nova-senha').value;
                var confirmar = document.getElementById('confirmar-senha').value;

                if (!nova || nova.length < 8) {
                    mostrarErro('A nova senha precisa ter ao menos 8 caracteres.');
                    return;
                }
                if (nova !== confirmar) {
                    mostrarErro('As senhas não coincidem.');
                    return;
                }

                btn.disabled = true;
                fetch('/usuarios/redefinirSenha', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        emailServer: email,
                        codigoServer: codigo,
                        novaSenhaServer: nova
                    })
                }).then(function (resposta) {
                    if (resposta.ok) {
                        sessionStorage.removeItem('EMAIL_RECUPERACAO');
                        sessionStorage.removeItem('CODIGO_RECUPERACAO');
                        alert('Senha alterada com sucesso! Faça login com a nova senha.');
                        window.location.href = '/login.html';
                    } else {
                        btn.disabled = false;
                        resposta.text().then(function (texto) {
                            mostrarErro(texto || 'Não foi possível alterar a senha.');
                        });
                    }
                }).catch(function () {
                    btn.disabled = false;
                    mostrarErro('Não foi possível conectar ao servidor.');
                });
            });
        })();
    </script>

</body>

</html>
